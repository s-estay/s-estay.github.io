{%- for tag in include.tags -%}
  {%- assign tag_slug = tag | downcase | replace: " ", "-" -%}
  {%- if include.lowercase -%}
    {%- assign tag_label = tag | downcase -%}
  {%- else -%}
    {%- assign tag_label = tag -%}
  {%- endif -%}
  <a href = "{{ site.baseurl }}/tags/{{ tag_slug }}/" class = "tag-link">{{ tag_label }}</a>{%- unless forloop.last -%}, {% endunless %}
{%- endfor -%}
