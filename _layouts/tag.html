---
layout: base
---
<div class = "main-container">
  <h1>{{ page.tag | downcase }}</h1>
  {% assign posts_with_tag = site.posts | where_exp: "post", "post.tags contains page.tag" %}
  {% for post in posts_with_tag %}
    <div class = "blog-list-entry">
      <time>{{ post.date | date: "%Y-%m-%d" }}</time>
      •
      <a href = "{{ post.url }}">{{ post.short_title | default: post.title }}</a>
    </div>
  {% endfor %}
  <footer>
    <a href = "{{ "/" | relative_url }}" class = "footer-button" id = "tag-back-button">Back to main</a>
  </footer>
</div>
